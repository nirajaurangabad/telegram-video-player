<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Video Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0f0f0f; 
            color: #fff; 
            padding: 20px; 
            text-align: center; 
            margin: 0;
        }
        h2 { font-size: 20px; margin-bottom: 15px; }
        input { 
            width: 90%; 
            max-width: 400px; 
            padding: 12px; 
            margin-top: 10px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            font-size: 14px;
        }
        button { 
            padding: 12px 24px; 
            margin-top: 15px; 
            background: #2481cc; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 15px;
            font-weight: bold;
        }
        button:active { background: #1d69a8; }
        video { 
            width: 100%; 
            max-width: 500px; 
            border-radius: 8px; 
            margin-top: 20px; 
            background: #000;
        }
    </style>
</head>
<body>
    <h2>Video Player Mini App</h2>
    <input type="text" id="videoUrl" placeholder="Yahan video ka direct MP4 link dalein..." value="https://www.w3schools.com/html/mov_bbb.mp4">
    <br>
    <button onclick="loadVideo()">Play Video</button>
    <br>
    <video id="myVideo" controls>
        <source id="videoSource" src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Aapka browser video tag ko support nahi karta.
    </video>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Yeh Telegram app ke andar full height me kholne ke liye hai

        function loadVideo() {
            let url = document.getElementById('videoUrl').value;
            let video = document.getElementById('myVideo');
            let source = document.getElementById('videoSource');
            if(url.trim() !== "") {
                source.src = url;
                video.load();
                video.play();
            } else {
                alert("Kripya valid video link dalein!");
            }
        }
    </script>
</body>
</html>
